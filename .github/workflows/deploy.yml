name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespace if not exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Try to create KV namespace, ignore if already exists
          KV_OUTPUT=$(wrangler kv namespace create "bet-journal" --account-id "$CLOUDFLARE_ACCOUNT_ID" 2>&1) || true
          echo "KV output: $KV_OUTPUT"
          
          # List namespaces and find bet-journal ID
          KV_LIST=$(wrangler kv namespace list --account-id "$CLOUDFLARE_ACCOUNT_ID" 2>&1)
          echo "KV list: $KV_LIST"
          
          # Extract ID using python
          KV_ID=$(echo "$KV_LIST" | python3 -c "
          import sys, json, re
          text = sys.stdin.read()
          # Find JSON array in output
          match = re.search(r'\[.*\]', text, re.DOTALL)
          if match:
              try:
                  data = json.loads(match.group())
                  for ns in data:
                      if ns.get('title') == 'bet-journal':
                          print(ns['id'])
                          break
              except: pass
          " 2>/dev/null)
          
          echo "KV_ID=$KV_ID" >> $GITHUB_OUTPUT
          echo "Found KV ID: $KV_ID"

      - name: Write wrangler.toml with KV binding
        env:
          KV_ID: ${{ steps.kv.outputs.KV_ID }}
        run: |
          cat > worker/wrangler.toml << TOML
          name = "massive-proxy"
          main = "index.js"
          compatibility_date = "2024-01-01"
          
          [[kv_namespaces]]
          binding = "BET_JOURNAL"
          id = "$KV_ID"
          TOML
          echo "wrangler.toml written with KV_ID: $KV_ID"
          cat worker/wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --verbose
