name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespace and get ID
        id: kv
        run: |
          # Try create (fails silently if exists)
          wrangler kv namespace create "bet-journal" 2>/dev/null || true

          # List all namespaces and extract the bet-journal ID
          KV_ID=$(wrangler kv namespace list 2>/dev/null | python3 -c "
          import sys, json, re
          text = sys.stdin.read()
          match = re.search(r'\[.*\]', text, re.DOTALL)
          if match:
              try:
                  for ns in json.loads(match.group()):
                      if ns.get('title') == 'bet-journal':
                          print(ns['id'])
                          break
              except: pass
          ")
          echo "KV_ID=$KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_OUTPUT

      - name: Write wrangler.toml with KV binding
        run: |
          KV_ID="${{ steps.kv.outputs.KV_ID }}"
          cat > worker/wrangler.toml << TOML
          name = "massive-proxy"
          main = "index.js"
          compatibility_date = "2024-01-01"

          [[kv_namespaces]]
          binding = "BET_JOURNAL"
          id = "$KV_ID"
          TOML
          echo "wrangler.toml written:"
          cat worker/wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
